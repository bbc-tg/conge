<body>
<header>
  <div class="brand"><div class="brandmark">IT</div><div><h1>ITTANGER</h1><small>Gestion des congés · Tanger</small></div></div>
  <nav id="nav">
    <button data-v="solde" class="on">Tableau de bord</button>
    <button data-v="conges">Congés</button>
    <button data-v="pers">Personnel</button>
  </nav>
  <div class="head-actions"><span id="syncstate" class="syncstate">● Sauvegarde locale</span><button class="b" id="cloudb">☁ Synchronisation</button><button class="b" id="lockb">Verrouiller</button></div>
</header>
<main id="main"></main>

<dialog id="dlg"><form method="dialog" id="frm" onsubmit="return false"></form></dialog>
<input type="file" id="file" accept=".csv,text/csv" hidden>
<div id="pf"></div>

<script>
(function(){
var K="ittanger-conges-v1",S={pers:[],conges:[],droit:22},view="solde",q="",only40=false;
function load(){try{var r=localStorage.getItem(K);if(r)S=JSON.parse(r)}catch(e){}}
var CLOUD_KEY="ittanger-cloud-config";
var cloudCfg=null, cloudSession=null, cloudBusy=false;
try{cloudCfg=JSON.parse(localStorage.getItem(CLOUD_KEY)||"null")}catch(e){}
function cloudStatus(t,ok){var n=document.getElementById("syncstate");if(n){n.textContent="● "+t;n.className="syncstate "+(ok?"good":"")}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){};if(cloudSession)cloudPush()}
function cloudHeaders(){return {"apikey":cloudCfg.anon,"Authorization":"Bearer "+cloudSession.access_token,"Content-Type":"application/json"}}
async function cloudRefresh(){
  if(!cloudCfg||!cloudCfg.refresh_token)return false;
  var r=await fetch(cloudCfg.url+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{"apikey":cloudCfg.anon,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:cloudCfg.refresh_token})});
  if(!r.ok)throw new Error("تعذر تجديد جلسة Supabase");
  cloudSession=await r.json();cloudCfg.refresh_token=cloudSession.refresh_token;localStorage.setItem(CLOUD_KEY,JSON.stringify(cloudCfg));return true;
}
async function cloudPush(){
  if(!cloudSession||cloudBusy)return;cloudBusy=true;cloudStatus("جاري المزامنة…",false);
  try{
    var r=await fetch(cloudCfg.url+"/rest/v1/app_state?on_conflict=id",{method:"POST",headers:Object.assign(cloudHeaders(),{"Prefer":"resolution=merge-duplicates,return=minimal"}),body:JSON.stringify({id:"main",data:S,updated_at:new Date().toISOString()})});
    if(r.status===401&&await cloudRefresh()){r=await fetch(cloudCfg.url+"/rest/v1/app_state?on_conflict=id",{method:"POST",headers:Object.assign(cloudHeaders(),{"Prefer":"resolution=merge-duplicates,return=minimal"}),body:JSON.stringify({id:"main",data:S,updated_at:new Date().toISOString()})})}
    if(!r.ok)throw new Error("Échec de synchronisation");cloudStatus("Synchronisé",true);
  }catch(e){cloudStatus("Hors ligne · sauvegarde locale",false)}finally{cloudBusy=false}
}
async function cloudConnect(){
  var url=prompt("Collez l’URL de votre projet Supabase (https://....supabase.co)",cloudCfg&&cloudCfg.url||"");if(!url)return;
  var anon=prompt("Collez la clé anon/public de Supabase",cloudCfg&&cloudCfg.anon||"");if(!anon)return;
  var email=prompt("Adresse e-mail de votre compte Supabase",cloudCfg&&cloudCfg.email||"");if(!email)return;
  var pass=prompt("Mot de passe de votre compte Supabase");if(!pass)return;
  cloudCfg={url:url.replace(/\/$/,""),anon:anon,email:email};cloudStatus("Connexion…",false);
  try{
    var auth=await fetch(cloudCfg.url+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"apikey":anon,"Content-Type":"application/json"},body:JSON.stringify({email:email,password:pass})});
    var ses=await auth.json();if(!auth.ok)throw new Error(ses.msg||ses.message||"Connexion refusée");
    cloudSession=ses;cloudCfg.refresh_token=ses.refresh_token;localStorage.setItem(CLOUD_KEY,JSON.stringify(cloudCfg));
    var read=await fetch(cloudCfg.url+"/rest/v1/app_state?id=eq.main&select=data",{headers:cloudHeaders()});
    if(!read.ok)throw new Error("Impossible de lire la base. Vérifiez le SQL de configuration.");
    var rows=await read.json();
    if(rows.length&&rows[0].data){S=rows[0].data;localStorage.setItem(K,JSON.stringify(S));render();cloudStatus("Données cloud chargées",true)}
    else{await cloudPush();cloudStatus("Cloud connecté",true)}
  }catch(e){cloudSession=null;cloudStatus("Cloud non connecté",false);alert("Connexion cloud impossible : "+e.message)}
}
document.getElementById("cloudb").onclick=cloudConnect;
async function resumeCloud(){
  if(!cloudCfg||!cloudCfg.refresh_token)return;
  try{await cloudRefresh();var r=await fetch(cloudCfg.url+"/rest/v1/app_state?id=eq.main&select=data",{headers:cloudHeaders()});if(r.ok){var rows=await r.json();if(rows.length&&rows[0].data){S=rows[0].data;localStorage.setItem(K,JSON.stringify(S));render()}cloudStatus("Synchronisé",true)}}catch(e){cloudStatus("Sauvegarde locale",false)}
}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function days(a,b){if(!a||!b)return 0;var d=new Date(a+"T00:00"),e=new Date(b+"T00:00"),n=0;if(e<d)return 0;for(;d<=e;d.setDate(d.getDate()+1)){var w=d.getDay();if(w!=0&&(S.sam||w!=6))n++}return n}
function fr(d){return d?d.split("-").reverse().join("/"):""}
function pName(m){var p=S.pers.find(function(x){return x.mat==m});return p?p.nom+" "+p.prenom:m}
var SD="2026-10-25",SD1="2026-10-26";
function after(c){return days(c.debut>SD1?c.debut:SD1,c.fin)}
function yrs(e,d){var n=d.getFullYear()-e.getFullYear();if(d.getMonth()<e.getMonth()||(d.getMonth()==e.getMonth()&&d.getDate()<e.getDate()))n--;return Math.max(0,n)}
function rowsSolde(){return S.pers.filter(function(p){return p.actif!==false}).map(function(p){var u=used(p.mat),has=p.solde!=null,ac=acquis(p);return{p:p,i:S.pers.indexOf(p),u:u,has:has,ac:ac,r:has?Math.round((p.solde+ac-u)*100)/100:null}}).sort(function(a,b){return (b.r==null?-1e9:b.r)-(a.r==null?-1e9:a.r)})}
function annuel(p,d){var y=p.embauche?yrs(new Date(p.embauche+"T00:00"),d):0;return Math.min(30,18+1.5*Math.floor(y/5))}
function acquis(p){var t=new Date(),m=(t.getFullYear()-2026)*12+(t.getMonth()-9);if(t.getDate()<25)m--;var s=0;for(var k=1;k<=m;k++)s+=annuel(p,new Date(2026,9+k,25))/12;return Math.round(s*100)/100}
function used(m){return S.conges.filter(function(c){return c.mat==m&&c.statut!="Refusé"}).reduce(function(s,c){return s+after(c)},0)}
function bar(extra){return '<div class="bar"><input id="q" placeholder="Rechercher…" value="'+esc(q)+'">'+(extra||"")+'</div>'}

function render(){
  var h="";
  if(view=="solde"){
    var all=rowsSolde(),n40=all.filter(function(x){return x.r>40}).length,list=all.filter(function(x){return match(x.p)&&(!only40||x.r>40)});
    h=bar('<label><input type="checkbox" id="f40"'+(only40?" checked":"")+'> Solde &gt; 40 j seulement</label><span class="tag a">'+n40+' agent(s) &gt; 40 j</span><span class="sp"></span><label><input type="checkbox" id="sam"'+(S.sam?" checked":"")+'> Compter le samedi</label><button class="b" data-a="xlsx">Exporter Excel</button>');
    h+='<div class="tw"><table><tr><th>Matricule</th><th>Nom</th><th>Date d’embauche</th><th>Droit annuel</th><th>Solde au 25/10/2026</th><th>Acquis depuis</th><th>Pris depuis</th><th>Solde actuel</th></tr>';
    list.forEach(function(x){var p=x.p,hi=x.r>40;
      h+='<tr'+(hi?' class="hi"':'')+'><td>'+esc(p.mat)+'</td><td>'+esc(p.nom+" "+p.prenom)+'</td><td>'+(p.embauche?fr(p.embauche):"—")+'</td><td>'+annuel(p,new Date())+' j/an'+(p.embauche?"":" *")+'</td><td>'+(x.has?p.solde+' j':"—")+'</td><td>+'+x.ac+' j</td><td>−'+x.u+' j</td><td>'+(x.has?'<b>'+x.r+' j</b>'+(hi?' <span class="tag a">+40 j</span>':""):"—")+'</td></tr>'});
    h+='</table>'+(list.length?"":'<div class="empty">Aucun agent à afficher.</div>')+'</div>';
    h+='<p class="hint">Solde actuel = solde au 25/10/2026 + jours acquis − jours pris après cette date (congés refusés exclus). Acquis : droit annuel ÷ 12 par mois écoulé, crédité le 25 de chaque mois (premier crédit le 25/11/2026).</p><p class="hint">Code du travail (art. 231-232) : 1,5 jour par mois (18 j/an), plus 1,5 jour par période entière de 5 ans de service, plafond 30 j/an. * Sans date d’embauche, 18 j/an est appliqué : renseignez la date dans Personnel › Modifier.</p>';
  }else if(view=="conges"){
    var l=S.conges.filter(function(c){return !q||(pName(c.mat)+c.mat+c.titre).toLowerCase().indexOf(q.toLowerCase())>-1}).sort(function(a,b){return b.debut.localeCompare(a.debut)});
    h=bar('<span class="sp"></span><button class="b" data-a="imp-c">Importer CSV</button><button class="b" data-a="exp-c">Exporter CSV</button><button class="b" data-a="xlsx">Exporter Excel</button><button class="b p" data-a="add-c">Ajouter un congé</button>');
    h+='<div class="tw"><table><tr><th>Agent</th><th>Titre</th><th>Demande</th><th>Du</th><th>Au</th><th>Jours</th><th>Statut</th><th></th></tr>';
    l.forEach(function(c){var i=S.conges.indexOf(c),cl=c.statut=="Validé"?"v":c.statut=="Refusé"?"r":"a";
      h+='<tr><td>'+esc(pName(c.mat))+'</td><td>'+esc(c.titre)+'</td><td>'+fr(c.demande)+'</td><td>'+fr(c.debut)+'</td><td>'+fr(c.fin)+'</td><td>'+days(c.debut,c.fin)+'</td><td><select data-st="'+i+'" class="tag '+cl+'">'+["En attente","Validé","Refusé"].map(function(s){return '<option'+(s==c.statut?" selected":"")+'>'+s+'</option>'}).join("")+'</select></td><td><button class="ic" data-ed="'+i+'">Modifier</button><button class="ic" data-pr="'+i+'">Imprimer</button><button class="ic" data-del-c="'+i+'" aria-label="Supprimer">Supprimer</button></td></tr>'});
    h+='</table>'+(l.length?"":'<div class="empty">Aucune demande pour le moment. Les nouvelles demandes apparaîtront ici.</div>')+'</div>';

function gate(){var on=unlocked();document.getElementById("nav").style.display=on?"flex":"none";document.getElementById("lockb").style.display=on?"":"none";

  document.getElementById("main").innerHTML='<div style="max-width:340px;margin:60px auto;text-align:center"><h2 style="margin:0 0 6px">Accès réservé</h2><p class="hint">Entrez votre mot de passe pour accéder à votre espace.</p><input id="code" type="password" autocomplete="off" placeholder="Mot de passe" style="width:100%;margin:12px 0"><button class="b p" id="go" style="width:100%">Déverrouiller</button><p id="err" class="hint" style="color:var(--er)"></p></div>';
  var go=function(){var v=document.getElementById("code").value.trim().toLowerCase();if(h53(v)===CODE_H){try{sessionStorage.setItem("cg-ok","1")}catch(e){}gate()}else{document.getElementById("err").textContent="Mot de passe incorrect."}};
